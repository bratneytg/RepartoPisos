name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests y APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RepartoPisos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RepartoPisos-apk
          path: RepartoPisos.apk

      # Enlace fijo para descargar el último APK desde el móvil:
      # https://github.com/<usuario>/RepartoPisos/releases/tag/latest
      - name: Publicar release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última versión
          body: APK compilado automáticamente con el último cambio. Descarga RepartoPisos.apk e instálalo.
          files: RepartoPisos.apk
